<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset Immich Desktop</title><link rel="stylesheet" href="style.css"><script src="reset.js" defer></script></head>
<body><main>
  <h1>Reset configuration and login?</h1>
  <p>This removes the saved server URL, API key, browser login data and cached original. Your photos on the Immich server stay intact.</p>
  <p>The app will restart and show setup.</p>
  <button id="reset" type="button">Reset and restart</button>
  <p id="reset-status" role="status"></p>
</main></body></html>
