<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Immich Desktop</title><link rel="stylesheet" href="style.css"><script src="setup.js" defer></script></head>
<body><main>
  <img class="app-icon" src="app-icon.png" width="96" height="96" alt="">
  <h1>Immich Desktop</h1>
  <section aria-labelledby="setup-title">
    <h2 id="setup-title">Connect your Immich server</h2>
    <form id="setup">
      <label>Server URL<input id="server" type="url" placeholder="https://photos.example.com" required autocomplete="url"></label>
      <label>API key (asset.read and asset.download)<input id="api-key" type="password" placeholder="Leave blank to reuse a saved key" autocomplete="off"></label>
      <button type="submit">Save and connect</button>
      <button id="open-immich" type="button">Open Immich</button>
    </form>
    <p>The API key is stored in the OS credential store. Log in normally after opening Immich. Your login session is remembered across restarts.</p>
    <p id="setup-status" role="status"></p>
  </section>
</main></body></html>
